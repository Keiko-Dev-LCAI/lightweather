<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LightWeather — down for maintenance</title>
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#e8e8f0;background:#0d0d1a;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  }
  .card{max-width:560px}
  .mark{font-size:56px;line-height:1;margin-bottom:16px}
  .badge{
    display:inline-block;font-size:12px;letter-spacing:2px;text-transform:uppercase;
    color:#00e5ff;margin-bottom:18px;font-weight:700;
  }
  h1{font-size:clamp(28px,6vw,44px);line-height:1.15;font-weight:800}
  p{margin-top:16px;font-size:18px;color:#9898b8}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🌤️</div>
    <div class="badge">LightWeather</div>
    <h1>Down for maintenance</h1>
    <p>Please check back soon.</p>
  </div>
  <script>
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        }).catch(function () {});
      }
    })();
  </script>
</body>
</html>

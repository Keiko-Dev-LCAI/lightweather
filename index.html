<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get LCAI — back soon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B3%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#eaf6ff;
    background:radial-gradient(1200px 700px at 50% -5%,#1a4e73 0%,#0c2f4d 45%,#06192c 100%);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    overflow:hidden;position:relative;
  }
  /* soft light rays */
  body::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(200deg,rgba(120,200,255,.10) 0%,transparent 35%),
      linear-gradient(160deg,rgba(120,200,255,.08) 0%,transparent 40%);
  }
  .card{position:relative;z-index:1;max-width:560px}
  .badge{
    display:inline-block;font-size:12px;letter-spacing:2px;text-transform:uppercase;
    color:#8fd7ff;opacity:.85;margin-bottom:22px;font-weight:700;
  }
  h1{
    font-size:clamp(30px,6vw,52px);line-height:1.15;font-weight:800;letter-spacing:.3px;
    text-shadow:0 2px 30px rgba(0,0,0,.35);
  }
  .accent{
    background:linear-gradient(180deg,#7fe3ff,#3fb6e6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p.sub{margin-top:18px;font-size:17px;color:#bfe3f7;opacity:.9}
  .wave{margin-top:34px;font-size:26px;letter-spacing:8px;color:#5fb8e6;opacity:.7}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Get&nbsp;LCAI</div>
    <h1>Keiko is on vacation to <span class="accent">Atlantis</span></h1>
    <p class="sub">The site is down for a little while. Back soon.</p>
    <div class="wave">~ ~ ~</div>
  </div>
</body>
</html>

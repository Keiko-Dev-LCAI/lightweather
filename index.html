<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LightWeather">
<title>⚡ LightWeather</title>
<style>
:root {
  --bg:      #0d0d1a;
  --bg2:     #12122a;
  --bg3:     #1a1a36;
  --border:  rgba(255,255,255,0.10);
  --text:    #f0f0ff;
  --text2:   #9090b0;
  --purple:  #9b7fe8;
  --purple-glow: rgba(155,127,232,0.12);
  --gold:    #e8c050;
  --blue:    #4b9ee8;
  --green:   #4caf7d;
  --red:     #e84b6a;
  --orange:  #e8904b;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

body { min-height: 100vh; padding-bottom: 40px; }

/* ── HEADER ── */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 12px;
  position: sticky; top: 0; z-index: 100;
}
.header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.logo { font-size: 56px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
.logo span { color: var(--purple); }
.lang-select {
  margin-left: auto;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 36px; padding: 8px 12px; cursor: pointer; outline: none;
}
.search-row { display: flex; gap: 10px; }
.search-wrap { flex: 1; position: relative; }
.search-input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); font-size: 40px; padding: 12px 16px; outline: none;
  transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--purple); }
.search-input::placeholder { color: var(--text2); }
.search-dropdown {
  position: absolute; top: 100%; left: 0; right: 0; background: var(--bg2);
  border: 1px solid var(--border); border-radius: 12px; margin-top: 4px;
  z-index: 200; max-height: 240px; overflow-y: auto; display: none;
}
.search-item { padding: 14px 16px; font-size: 36px; cursor: pointer; border-bottom: 1px solid var(--border); }
.search-item:last-child { border-bottom: none; }
.search-item:hover { background: var(--purple-glow); }
.loc-btn {
  background: var(--purple); border: none; border-radius: 12px;
  color: #fff; font-size: 44px; padding: 12px 18px; cursor: pointer;
  white-space: nowrap; font-weight: 700;
}
.loc-btn:active { opacity: 0.8; }

/* ── ALERT BANNER ── */
.alert-banner {
  margin: 16px 20px 0;
  background: rgba(232,75,75,0.15); border: 1px solid rgba(232,75,75,0.5);
  border-radius: 14px; padding: 14px 18px; font-size: 36px; line-height: 1.55;
  display: none;
}
.alert-banner.show { display: block; }
.alert-title { font-size: 40px; font-weight: 700; color: #ff6b6b; margin-bottom: 6px; }
.alert-body { color: var(--text); }
.alert-dismiss { margin-top: 10px; background: none; border: 1px solid rgba(232,75,75,0.4); border-radius: 8px; color: var(--text2); font-size: 32px; padding: 6px 14px; cursor: pointer; }

/* ── LOADING / EMPTY STATES ── */
.state-box { text-align: center; padding: 80px 30px; }
.state-icon { font-size: 144px; margin-bottom: 20px; }
.state-title { font-size: 56px; font-weight: 700; margin-bottom: 12px; }
.state-sub { font-size: 40px; color: var(--text2); line-height: 1.6; }
.spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── CURRENT WEATHER CARD ── */
.weather-main { padding: 24px 20px 0; }
.location-name { font-size: 56px; font-weight: 700; margin-bottom: 4px; }
.location-sub { font-size: 36px; color: var(--text2); margin-bottom: 20px; }
.current-card {
  background: linear-gradient(135deg, var(--bg2), var(--bg3));
  border: 1px solid var(--border); border-radius: 20px;
  padding: 28px 24px; margin-bottom: 16px;
}
.temp-row { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 16px; }
.temp-big { font-size: 176px; font-weight: 300; line-height: 1; letter-spacing: -4px; }
.temp-info { display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 8px; }
.condition-text { font-size: 44px; font-weight: 600; margin-bottom: 6px; }
.feels-like { font-size: 36px; color: var(--text2); }
.condition-icon { width: 160px; height: 160px; margin-left: auto; }
.details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.detail-item { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 14px 16px; }
.detail-label { font-size: 30px; color: var(--text2); margin-bottom: 4px; }
.detail-value { font-size: 44px; font-weight: 600; }

/* ── UV INDEX BAR ── */
.uv-bar { width: 100%; height: 8px; border-radius: 4px; background: linear-gradient(to right, #4caf7d, #e8c050, #e8904b, #e84b6a); margin-top: 6px; position: relative; }
.uv-dot { width: 14px; height: 14px; background: #fff; border-radius: 50%; position: absolute; top: -3px; transform: translateX(-50%); box-shadow: 0 0 4px rgba(0,0,0,0.5); }

/* ── AI EXPLANATION ── */
.ai-section { margin: 0 20px 20px; }
.ai-btn {
  width: 100%; background: var(--purple-glow); border: 1px solid var(--purple);
  border-radius: 14px; color: var(--text); font-size: 44px; padding: 16px;
  cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.ai-btn:active { opacity: 0.8; }
.ai-result {
  background: var(--bg2); border: 1px solid var(--purple);
  border-radius: 14px; padding: 20px 22px; margin-top: 12px;
  font-size: 44px; line-height: 1.65; color: var(--text); display: none;
}
.ai-result.show { display: block; }

/* ── FORECAST ── */
.forecast-section { padding: 0 20px 20px; }
.section-label { font-size: 40px; font-weight: 700; color: var(--text2); margin-bottom: 14px; letter-spacing: 0.5px; text-transform: uppercase; font-size: 32px; }
.forecast-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
.forecast-scroll::-webkit-scrollbar { display: none; }
.forecast-card {
  flex: 0 0 180px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px 12px; text-align: center; min-width: 180px;
}
.forecast-card.today { border-color: var(--purple); background: var(--purple-glow); }
.fc-day { font-size: 34px; font-weight: 700; margin-bottom: 8px; }
.fc-icon { font-size: 72px; margin-bottom: 8px; }
.fc-high { font-size: 44px; font-weight: 700; }
.fc-low { font-size: 34px; color: var(--text2); margin-top: 2px; }
.fc-rain { font-size: 30px; color: var(--blue); margin-top: 6px; }

/* ── SUNRISE/SUNSET ── */
.sun-row { display: flex; gap: 12px; margin: 0 20px 20px; }
.sun-card { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; }
.sun-icon { font-size: 72px; margin-bottom: 6px; }
.sun-label { font-size: 30px; color: var(--text2); margin-bottom: 4px; }
.sun-time { font-size: 48px; font-weight: 700; }

/* ── FOOTER ── */
.footer { text-align: center; padding: 30px 20px 10px; color: var(--text2); font-size: 34px; border-top: 1px solid var(--border); margin-top: 20px; }
.footer a { color: var(--purple); text-decoration: none; }

/* ── UNIT TOGGLE ── */
.unit-toggle { display: flex; gap: 0; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.unit-btn { flex: 1; background: none; border: none; color: var(--text2); font-size: 34px; padding: 8px 12px; cursor: pointer; }
.unit-btn.active { background: var(--purple); color: #fff; font-weight: 700; }

/* ── SAVED PLACES ── */
.save-place-btn {
  background: none; border: 1px solid var(--gold); border-radius: 10px;
  color: var(--gold); font-size: 36px; padding: 6px 14px; cursor: pointer;
  margin-left: 12px; vertical-align: middle; font-weight: 600;
}
.save-place-btn:active { opacity: 0.7; }
.places-panel {
  display: none; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; margin-top: 10px; max-height: 400px; overflow-y: auto;
}
.places-panel.open { display: block; }
.places-header { font-size: 36px; font-weight: 700; color: var(--text2); padding: 14px 18px 8px; border-bottom: 1px solid var(--border); }
.places-empty { font-size: 34px; color: var(--text2); padding: 20px 18px; text-align: center; }
.place-item { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: pointer; }
.place-item:last-child { border-bottom: none; }
.place-item:hover { background: var(--purple-glow); }
.place-item-info { flex: 1; min-width: 0; }
.place-label { font-size: 40px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place-sub { font-size: 30px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place-del { background: none; border: none; color: var(--text2); font-size: 44px; padding: 4px 8px; cursor: pointer; line-height: 1; }
.place-del:hover { color: var(--red); }

/* ── SAVE MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  z-index: 500; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg2); border: 1px solid var(--purple);
  border-radius: 20px; padding: 32px 28px; width: 90%; max-width: 560px;
}
.modal-title { font-size: 48px; font-weight: 700; margin-bottom: 8px; }
.modal-sub { font-size: 34px; color: var(--text2); margin-bottom: 20px; }
.modal-input {
  width: 100%; background: var(--bg3); border: 1px solid var(--purple);
  border-radius: 12px; color: var(--text); font-size: 40px; padding: 14px 16px;
  outline: none; margin-bottom: 20px;
}
.modal-btns { display: flex; gap: 12px; }
.modal-btn { flex: 1; border: none; border-radius: 12px; font-size: 40px; padding: 14px; cursor: pointer; font-weight: 700; }
.modal-btn-save { background: var(--purple); color: #fff; }
.modal-btn-cancel { background: var(--bg3); color: var(--text2); }
.modal-btn:active { opacity: 0.8; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="logo">⚡ Light<span>Weather</span></div>
    <div class="unit-toggle">
      <button class="unit-btn active" id="btn-f" onclick="setUnit('F')">°F</button>
      <button class="unit-btn" id="btn-c" onclick="setUnit('C')">°C</button>
    </div>
    <select class="lang-select" id="lang-select" onchange="setLanguage(this.value)">
      <option value="en">🇺🇸 EN</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="es">🇪🇸 ES</option>
      <option value="fr">🇫🇷 FR</option>
      <option value="ja">🇯🇵 日本語</option>
      <option value="ko">🇰🇷 한국어</option>
    </select>
  </div>
  <div class="search-row">
    <div class="search-wrap">
      <input class="search-input" id="search-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="Search any city…" oninput="onSearchInput()" onkeydown="if(event.key==='Enter')doSearch()">
      <div class="search-dropdown" id="search-dropdown"></div>
    </div>
    <button class="loc-btn" onclick="getLocation()" title="Use my location">📍</button>
    <button class="loc-btn" onclick="togglePlacesPanel()" title="Saved Places" style="background:var(--bg3);border:1px solid var(--border);font-size:40px;">📌</button>
  </div>
  <div class="places-panel" id="places-panel"></div>
</div>

<!-- SAVE PLACE MODAL -->
<div class="modal-overlay" id="save-modal">
  <div class="modal-box">
    <div class="modal-title">📌 Save This Place</div>
    <div class="modal-sub" id="save-modal-city">Give this place a name</div>
    <input class="modal-input" id="save-modal-input" type="text" placeholder="e.g. Mom's House, Sister's Home…" maxlength="40"
           onkeydown="if(event.key==='Enter')confirmSavePlace()">
    <div class="modal-btns">
      <button class="modal-btn modal-btn-save" onclick="confirmSavePlace()">Save</button>
      <button class="modal-btn modal-btn-cancel" onclick="closeSaveModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- ALERT BANNER -->
<div class="alert-banner" id="alert-banner">
  <div class="alert-title" id="alert-title">🚨 Severe Weather Alert</div>
  <div class="alert-body" id="alert-body"></div>
  <button class="alert-dismiss" onclick="dismissAlert()" data-i18n="dismiss">Dismiss</button>
</div>

<!-- MAIN CONTENT -->
<div id="main-content">
  <div class="state-box">
    <div class="state-icon">⚡</div>
    <div class="state-title" data-i18n="welcome_title">Welcome to LightWeather</div>
    <div class="state-sub" data-i18n="welcome_sub">Tap 📍 for your local weather, or search any city in the world.</div>
  </div>
</div>

<div class="footer">
  Powered by <a href="https://lightchain.ai" target="_blank">Lightchain AI</a> &nbsp;·&nbsp;
  <a href="mailto:orcamail.ai" data-i18n="advertise">📢 Advertise with us</a>
</div>

// ════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
let currentLang = 'en';
let currentUnit = 'F';
let currentWeatherData = null;
let currentQuery = null;
let searchTimer = null;
let alertDismissed = false;
let savedPlaces = [];

function loadSavedPlaces() {
  try { savedPlaces = JSON.parse(localStorage.getItem('lw_saved_places') || '[]'); } catch(e) { savedPlaces = []; }
}
function writeSavedPlaces() {
  try { localStorage.setItem('lw_saved_places', JSON.stringify(savedPlaces)); } catch(e) {}
}

function togglePlacesPanel() {
  var panel = document.getElementById('places-panel');
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
  } else {
    renderPlacesPanel();
    panel.classList.add('open');
  }
}

function renderPlacesPanel() {
  loadSavedPlaces();
  var panel = document.getElementById('places-panel');
  if (!savedPlaces.length) {
    panel.innerHTML = '<div class="places-header">📌 Saved Places</div><div class="places-empty">No saved places yet.<br>Load a city and tap ⭐ to save it.</div>';
    return;
  }
  var items = savedPlaces.map(function(p, i) {
    return '<div class="place-item" onclick="loadSavedPlace(' + i + ')">' +
      '<div class="place-item-info">' +
        '<div class="place-label">' + escHtml(p.label) + '</div>' +
        '<div class="place-sub">' + escHtml(p.cityDisplay || p.q) + '</div>' +
      '</div>' +
      '<button class="place-del" onclick="deleteSavedPlace(event,' + i + ')">✕</button>' +
    '</div>';
  }).join('');
  panel.innerHTML = '<div class="places-header">📌 Saved Places</div>' + items;
}

function loadSavedPlace(index) {
  loadSavedPlaces();
  var p = savedPlaces[index];
  if (!p) return;
  document.getElementById('places-panel').classList.remove('open');
  loadWeather(p.q);
}

function deleteSavedPlace(event, index) {
  event.stopPropagation();
  loadSavedPlaces();
  savedPlaces.splice(index, 1);
  writeSavedPlaces();
  renderPlacesPanel();
}

function saveCurrentPlace() {
  if (!currentWeatherData || !currentQuery) return;
  var loc = currentWeatherData.location;
  var cityDisplay = loc.name + (loc.region ? ', ' + loc.region : '') + ', ' + loc.country;
  document.getElementById('save-modal-city').textContent = cityDisplay;
  document.getElementById('save-modal-input').value = loc.name;
  document.getElementById('save-modal').classList.add('open');
  setTimeout(function() { document.getElementById('save-modal-input').focus(); }, 100);
}

function confirmSavePlace() {
  var label = document.getElementById('save-modal-input').value.trim();
  if (!label) { document.getElementById('save-modal-input').focus(); return; }
  loadSavedPlaces();
  var loc = currentWeatherData.location;
  var cityDisplay = loc.name + (loc.region ? ', ' + loc.region : '') + ', ' + loc.country;
  // Remove duplicate if same query already saved
  savedPlaces = savedPlaces.filter(function(p) { return p.q !== currentQuery; });
  savedPlaces.push({ label: label, q: currentQuery, cityDisplay: cityDisplay });
  writeSavedPlaces();
  closeSaveModal();
  // Brief confirmation on the ⭐ button
  var btn = document.getElementById('save-place-btn');
  if (btn) { btn.textContent = '✅ Saved!'; setTimeout(function() { if (btn) btn.textContent = '⭐ Save Place'; }, 1800); }
}

function closeSaveModal() {
  document.getElementById('save-modal').classList.remove('open');
}

// Close places panel when clicking outside
document.addEventListener('click', function(e) {
  if (!e.target.closest('.header') && !e.target.closest('#save-modal')) {
    var panel = document.getElementById('places-panel');
    if (panel) panel.classList.remove('open');
  }
});

    loading: '날씨 로딩 중…',

    feels_like: '체감 온도',

function t(key) {
  return (STRINGS[currentLang] && STRINGS[currentLang][key]) || STRINGS['en'][key] || key;
}

function setLanguage(lang) {
  currentLang = lang;
  document.getElementById('lang-select').value = lang;
  document.getElementById('search-input').placeholder = t('search_placeholder');
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    el.textContent = t(el.dataset.i18n);
  });
  if (currentWeatherData) renderWeather(currentWeatherData);
}

// ════════════════════════════════════════════════════════════════
// UNITS
// ════════════════════════════════════════════════════════════════
function setUnit(u) {
  currentUnit = u;
  document.getElementById('btn-f').classList.toggle('active', u === 'F');
  document.getElementById('btn-c').classList.toggle('active', u === 'C');
  if (currentWeatherData) renderWeather(currentWeatherData);
}

function temp(c) {
  if (currentUnit === 'F') return Math.round(c * 9/5 + 32) + '°F';
  return Math.round(c) + '°C';
}
function tempNum(c) {
  return currentUnit === 'F' ? Math.round(c * 9/5 + 32) : Math.round(c);
}
function wind(kph) {
  if (currentUnit === 'F') return Math.round(kph * 0.621) + ' mph';
  return Math.round(kph) + ' km/h';
}
function visibility(km) {
  if (currentUnit === 'F') return Math.round(km * 0.621) + ' mi';
  return Math.round(km) + ' km';
}
function pressure(mb) {
  return mb + ' mb';
}

// ════════════════════════════════════════════════════════════════
// SEARCH
// ════════════════════════════════════════════════════════════════
function onSearchInput() {
  clearTimeout(searchTimer);
  var q = document.getElementById('search-input').value.trim();
  if (q.length < 2) { hideDropdown(); return; }
  searchTimer = setTimeout(function() { fetchSuggestions(q); }, 300);
}

async function fetchSuggestions(q) {
  try {
    var r = await fetch(BACKEND + '/api/search?q=' + encodeURIComponent(q));
    var results = await r.json();
    if (!Array.isArray(results) || !results.length) { hideDropdown(); return; }
    var dd = document.getElementById('search-dropdown');
    dd.innerHTML = results.slice(0, 6).map(function(c) {
      return '<div class="search-item" onclick="selectCity(\'' + escHtml(c.name + ', ' + c.country) + '\')">' +
             escHtml(c.name) + ', <span style="color:var(--text2)">' + escHtml(c.region ? c.region + ', ' : '') + c.country + '</span></div>';
    }).join('');
    dd.style.display = 'block';
  } catch(e) { hideDropdown(); }
}

function selectCity(name) {
  document.getElementById('search-input').value = name;
  hideDropdown();
  loadWeather(name);
}

function hideDropdown() {
  document.getElementById('search-dropdown').style.display = 'none';
}

function doSearch() {
  var q = document.getElementById('search-input').value.trim();
  if (q) { hideDropdown(); loadWeather(q); }
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-wrap')) hideDropdown();
  if (!e.target.closest('.header') && !e.target.closest('#save-modal')) {
    var panel = document.getElementById('places-panel');
    if (panel) panel.classList.remove('open');
  }
});

// ════════════════════════════════════════════════════════════════
// GEOLOCATION
// ════════════════════════════════════════════════════════════════
function getLocation() {
  if (!navigator.geolocation) { showError(t('location_error')); return; }
  showLoading();
  navigator.geolocation.getCurrentPosition(
    function(pos) { loadWeather(pos.coords.latitude + ',' + pos.coords.longitude); },
    function()    { showError(t('location_error')); },
    { timeout: 10000 }
  );
}

// ════════════════════════════════════════════════════════════════
// WEATHER DATA
// ════════════════════════════════════════════════════════════════
async function loadWeather(q) {
  currentQuery = q;
  showLoading();
  alertDismissed = false;
  document.getElementById('alert-banner').classList.remove('show');
  try {
    var r = await fetch(BACKEND + '/api/weather?q=' + encodeURIComponent(q));
    if (!r.ok) { showError(t('not_found')); return; }
    var data = await r.json();
    if (data.error) { showError(t('not_found')); return; }
    currentWeatherData = data;
    renderWeather(data);
  } catch(e) {
    showError('Connection error. Please try again.');
  }
}

// ════════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════════
function renderWeather(data) {
  var loc  = data.location;
  var cur  = data.current;
  var fc   = data.forecast.forecastday;
  var alerts = (data.alerts && data.alerts.alert) || [];

  // Alerts
  if (alerts.length && !alertDismissed) {
    var a = alerts[0];
    document.getElementById('alert-title').textContent = '🚨 ' + (a.event || 'Severe Weather Alert');
    document.getElementById('alert-body').textContent  = a.headline || a.desc || '';
    document.getElementById('alert-banner').classList.add('show');
  }

  // UV bar position
  var uvPct = Math.min((cur.uv / 11) * 100, 100);

  // Condition icon
  var iconUrl = cur.condition.icon ? 'https:' + cur.condition.icon : '';

  // 7-day forecast cards
  var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  if (currentLang === 'zh') dayNames = ['日','一','二','三','四','五','六'];
  if (currentLang === 'es') dayNames = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  if (currentLang === 'fr') dayNames = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  if (currentLang === 'ja') dayNames = ['日','月','火','水','木','金','土'];
  if (currentLang === 'ko') dayNames = ['일','월','화','수','목','금','토'];

  var fcCards = fc.map(function(day, i) {
    var d = new Date(day.date + 'T12:00:00');
    var dayLabel = i === 0 ? t('today') : dayNames[d.getDay()];
    var fcIcon = day.day.condition.icon ? 'https:' + day.day.condition.icon : '';
    var rainChance = day.day.daily_chance_of_rain;
    return '<div class="forecast-card' + (i === 0 ? ' today' : '') + '">' +
      '<div class="fc-day">' + dayLabel + '</div>' +
      (fcIcon ? '<img src="' + fcIcon + '" style="width:96px;height:96px;margin:0 auto 4px;display:block">' : '<div class="fc-icon">🌤</div>') +
      '<div class="fc-high">' + tempNum(day.day.maxtemp_c) + '°</div>' +
      '<div class="fc-low">' + tempNum(day.day.mintemp_c) + '°</div>' +
      (rainChance > 10 ? '<div class="fc-rain">💧 ' + rainChance + '%</div>' : '') +
      '</div>';
  }).join('');

  // Today sunrise/sunset
  var todaySun = fc[0] ? fc[0].astro : {};

  // Build main HTML
  var html = '<div class="weather-main">' +
    '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:4px;">' +
      '<div class="location-name" style="margin-bottom:0">' + escHtml(loc.name) + '</div>' +
      '<button id="save-place-btn" class="save-place-btn" onclick="saveCurrentPlace()">⭐ Save Place</button>' +
    '</div>' +
    '<div class="location-sub">' + escHtml(loc.region ? loc.region + ', ' + loc.country : loc.country) + ' &nbsp;·&nbsp; ' + escHtml(loc.localtime) + '</div>' +

    '<div class="current-card">' +
      '<div class="temp-row">' +
        '<div class="temp-big">' + tempNum(cur.temp_c) + '°</div>' +
        '<div class="temp-info">' +
          '<div class="condition-text">' + escHtml(cur.condition.text) + '</div>' +
          '<div class="feels-like">' + t('feels_like') + ' ' + temp(cur.feelslike_c) + '</div>' +
        '</div>' +
        (iconUrl ? '<img class="condition-icon" src="' + iconUrl + '">' : '') +
      '</div>' +

      '<div class="details-grid">' +
        '<div class="detail-item"><div class="detail-label">💧 ' + t('humidity') + '</div><div class="detail-value">' + cur.humidity + '%</div></div>' +
        '<div class="detail-item"><div class="detail-label">💨 ' + t('wind') + '</div><div class="detail-value">' + wind(cur.wind_kph) + ' ' + cur.wind_dir + '</div></div>' +
        '<div class="detail-item"><div class="detail-label">👁 ' + t('visibility') + '</div><div class="detail-value">' + visibility(cur.vis_km) + '</div></div>' +
        '<div class="detail-item"><div class="detail-label">🌡 ' + t('pressure') + '</div><div class="detail-value">' + pressure(cur.pressure_mb) + '</div></div>' +
      '</div>' +

      '<div style="margin-top:14px">' +
        '<div class="detail-label" style="margin-bottom:6px">☀️ ' + t('uv_index') + ' — ' + cur.uv + ' ' + uvLabel(cur.uv) + '</div>' +
        '<div class="uv-bar"><div class="uv-dot" style="left:' + uvPct + '%"></div></div>' +
      '</div>' +
    '</div>' +
  '</div>' +

  // AI button
  '<div class="ai-section">' +
    '<button class="ai-btn" id="ai-btn" onclick="explainForecast()">' + t('ai_btn') + '</button>' +
    '<div class="ai-result" id="ai-result"></div>' +
  '</div>' +

  // Sunrise / Sunset
  (todaySun.sunrise ? '<div class="sun-row">' +
    '<div class="sun-card"><div class="sun-icon">🌅</div><div class="sun-label">' + t('sunrise') + '</div><div class="sun-time">' + todaySun.sunrise + '</div></div>' +
    '<div class="sun-card"><div class="sun-icon">🌇</div><div class="sun-label">' + t('sunset') + '</div><div class="sun-time">' + todaySun.sunset + '</div></div>' +
  '</div>' : '') +

  // 7-day forecast
  '<div class="forecast-section">' +
    '<div class="section-label">' + t('seven_day') + '</div>' +
    '<div class="forecast-scroll">' + fcCards + '</div>' +
  '</div>';

  document.getElementById('main-content').innerHTML = html;
}

function uvLabel(uv) {
  if (uv <= 2) return '(Low)';
  if (uv <= 5) return '(Moderate)';
  if (uv <= 7) return '(High)';
  if (uv <= 10) return '(Very High)';
  return '(Extreme)';
}

// ════════════════════════════════════════════════════════════════
// AI EXPLANATION
// ════════════════════════════════════════════════════════════════
async function explainForecast() {
  if (!currentWeatherData) return;
  var btn = document.getElementById('ai-btn');
  var res = document.getElementById('ai-result');
  if (!btn || !res) return;
  btn.textContent = t('ai_loading');
  btn.disabled = true;
  res.classList.remove('show');

  var d = currentWeatherData;
  var cur = d.current;
  var fc  = d.forecast.forecastday;
  var loc = d.location;
  var alerts = (d.alerts && d.alerts.alert) || [];

  var weekSummary = fc.map(function(day) {
    var date = new Date(day.date + 'T12:00:00');
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    return days[date.getDay()] + ': ' + day.day.condition.text + ', high ' + Math.round(day.day.maxtemp_c) + '°C / low ' + Math.round(day.day.mintemp_c) + '°C' +
      (day.day.daily_chance_of_rain > 20 ? ', ' + day.day.daily_chance_of_rain + '% rain' : '');
  }).join('\n');

  var alertText = alerts.length ? '\nALERT: ' + (alerts[0].event || '') + ' — ' + (alerts[0].headline || '') : '';

  var summary = 'Location: ' + loc.name + ', ' + loc.country + '\n' +
    'Current: ' + Math.round(cur.temp_c) + '°C, ' + cur.condition.text + ', feels like ' + Math.round(cur.feelslike_c) + '°C\n' +
    'Humidity: ' + cur.humidity + '%, Wind: ' + cur.wind_kph + ' km/h ' + cur.wind_dir + ', UV: ' + cur.uv + '\n' +
    'This week:\n' + weekSummary + alertText;

  try {
    var r = await fetch(BACKEND + '/api/explain', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({summary: summary, language: currentLang})
    });
    var data = await r.json();
    res.textContent = data.explanation || 'No explanation available.';
    res.classList.add('show');
  } catch(e) {
    res.textContent = 'Could not reach AI assistant. Please try again.';
    res.classList.add('show');
  }

  btn.textContent = t('ai_btn');
  btn.disabled = false;
}

// ════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════
function showLoading() {
  document.getElementById('main-content').innerHTML =
    '<div class="state-box"><div class="spinner"></div><div class="state-title">' + t('loading') + '</div></div>';
}
function showError(msg) {
  document.getElementById('main-content').innerHTML =
    '<div class="state-box"><div class="state-icon">😔</div><div class="state-title">' + msg + '</div>' +
    '<div class="state-sub" style="margin-top:12px">Try searching a different city.</div></div>';
}
function dismissAlert() {
  alertDismissed = true;
  document.getElementById('alert-banner').classList.remove('show');
}
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ════════════════════════════════════════════════════════════════
// INIT — auto-detect language + auto-load local weather
// ════════════════════════════════════════════════════════════════
(function() {
  var nav = navigator.language || 'en';
  var lang = nav.split('-')[0].toLowerCase();
  if (['en','zh','es','fr','ja','ko'].includes(lang)) setLanguage(lang);
  else setLanguage('en');
  // Auto-load local weather on page open
  getLocation();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keiko on vacation — back soon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B3%3C/text%3E%3C/svg%3E">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#eaf6ff;
    background:radial-gradient(1200px 700px at 50% -5%,#1a4e73 0%,#0c2f4d 45%,#06192c 100%);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    overflow:hidden;position:relative;
  }
  body::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(200deg,rgba(120,200,255,.10) 0%,transparent 35%),
      linear-gradient(160deg,rgba(120,200,255,.08) 0%,transparent 40%);
  }
  .card{position:relative;z-index:1;max-width:620px}
  .dolphin{font-size:64px;line-height:1;margin-bottom:18px;filter:drop-shadow(0 6px 24px rgba(0,0,0,.4))}
  .badge{
    display:inline-block;font-size:12px;letter-spacing:2px;text-transform:uppercase;
    color:#8fd7ff;opacity:.85;margin-bottom:22px;font-weight:700;
  }
  h1{
    font-size:clamp(32px,6.5vw,56px);line-height:1.12;font-weight:800;letter-spacing:.3px;
    text-shadow:0 2px 30px rgba(0,0,0,.35);
  }
  .accent{
    background:linear-gradient(180deg,#7fe3ff,#3fb6e6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p.sub{margin-top:20px;font-size:19px;color:#bfe3f7;opacity:.92}
  p.note{margin-top:14px;font-size:15px;color:#8fb8d1;opacity:.75}
  .wave{margin-top:36px;font-size:26px;letter-spacing:8px;color:#5fb8e6;opacity:.7}
</style>
</head>
<body>
  <div class="card">
    <div class="dolphin">🐬</div>
    <!-- BADGE: set per app, e.g. "OrcaVault", "Binai", "LightTube" -->
    <div class="badge" id="appBadge">LightWeather</div>
    <h1>Keiko is <span class="accent">on vacation</span></h1>
    <p class="sub">Back soon.</p>
    <p class="note">Thanks for stopping by — see you shortly.</p>
    <div class="wave">~ ~ ~</div>
  </div>
</body>
</html>
